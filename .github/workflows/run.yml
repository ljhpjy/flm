name: FLM Manual Run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto      # 按 state 判断
          - force     # 强制注册新号
          - info      # 只看状态

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch core script from private gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_RAW_URL: ${{ secrets.GIST_RAW_URL }}
        run: |
          set -e
          curl -sfL -H "Authorization: token $GIST_TOKEN" "$GIST_RAW_URL" -o flm_core.py
          echo "--- 脚本前 5 行 ---"
          head -5 flm_core.py
          echo "--- 行数: $(wc -l < flm_core.py) ---"

      - name: Run
        env:
          PYTHONIOENCODING: utf-8
          FLM_REFRESH_BEFORE: '600'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          echo "模式: $MODE"
          if [ "$MODE" = "force" ]; then
            python3 flm_core.py --force
          elif [ "$MODE" = "info" ]; then
            python3 flm_core.py --info
          else
            python3 flm_core.py
          fi

      - name: Show result
        if: always()
        run: |
          echo "=== 文件列表 ==="
          ls -la sub.txt state.json accounts.json 2>/dev/null || echo "（部分文件不存在）"
          echo ""
          if [ -f state.json ]; then
            echo "=== state.json ==="
            cat state.json
          fi
          echo ""
          if [ -f sub.txt ]; then
            echo "=== sub.txt 前 100 字节 ==="
            head -c 100 sub.txt; echo
          fi

      - name: Commit
        run: |
          git config user.name  "flm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sub.txt state.json accounts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无变化，不提交"
          else
            git commit -q -m "run: $(date -u '+%F %H:%M UTC') [${{ github.event.inputs.mode }}]"
            git push -q
            echo "已推送"
          fi
