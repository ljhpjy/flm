name: FLM Auto Renew

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - force
          - refresh
          - info

permissions:
  contents: write

concurrency:
  group: flm-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch core from private gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_RAW_URL: ${{ secrets.GIST_RAW_URL }}
        run: |
          set -e
          curl -sfL -H "Authorization: token $GIST_TOKEN" "$GIST_RAW_URL" -o flm_core.py
          echo "脚本行数: $(wc -l < flm_core.py)"

      - name: Run
        id: run
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          FLM_WINDOW: '60'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="auto"; fi
          echo "==== 模式: $MODE ===="
          python3 flm_core.py --"$MODE"
          echo "---- exit code: $? ----"

      - name: Show state
        if: always()
        run: |
          echo "==== 文件列表 ===="
          ls -la sub.txt expire_at.txt 2>/dev/null || echo "(未生成任何输出文件)"
          echo ""
          echo "==== expire_at.txt ===="
          if [ -f expire_at.txt ]; then
            EXP=$(cat expire_at.txt)
            NOW=$(date +%s)
            echo "expire_at = $EXP"
            echo "now       = $NOW"
            echo "diff      = $((NOW - EXP))"
            if [ "$EXP" != "0" ]; then
              echo "到期时间   = $(date -u -d @$EXP '+%F %H:%M:%S UTC')"
            fi
          else
            echo "(不存在)"
          fi
          echo ""
          echo "==== sub.txt ===="
          if [ -f sub.txt ]; then
            echo "大小: $(wc -c < sub.txt) 字节"
            echo "前 80 字节:"
            head -c 80 sub.txt; echo
          else
            echo "(不存在)"
          fi

      - name: Commit
        if: always()
        run: |
          set +e
          git config user.name  "flm-bot"
          git config user.email "bot@users.noreply.github.com"

          # 只添加「确实存在」的文件
          ADDED=0
          for f in sub.txt expire_at.txt; do
            if [ -f "$f" ]; then
              git add "$f"
              ADDED=$((ADDED + 1))
              echo "已加入暂存: $f"
            else
              echo "跳过（不存在）: $f"
            fi
          done

          if [ "$ADDED" -eq 0 ]; then
            echo "⚠ 本次没有生成任何输出文件（info 模式或脚本未成功）"
            exit 0
          fi

          if git diff --staged --quiet; then
            echo "内容无变化，不提交"
          else
            git commit -q -m "auto: $(date -u '+%F %H:%M UTC')"
            git push -q && echo "✓ 已推送"
          fi
          exit 0
