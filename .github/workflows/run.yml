name: FLM Auto Renew

on:
  schedule:
    # 每小时整点（UTC）
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - force
          - refresh
          - info

permissions:
  contents: write

concurrency:
  group: flm-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch core from private gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_RAW_URL: ${{ secrets.GIST_RAW_URL }}
        run: |
          set -e
          curl -sfL -H "Authorization: token $GIST_TOKEN" "$GIST_RAW_URL" -o flm_core.py
          echo "脚本行数: $(wc -l < flm_core.py)"

      - name: Run
        env:
          PYTHONIOENCODING: utf-8
          FLM_WINDOW: '60'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="auto"; fi
          echo "==== 模式: $MODE ===="
          python3 flm_core.py --"$MODE"

      - name: Show state
        if: always()
        run: |
          echo "==== 文件 ===="
          ls -la sub.txt expire_at.txt 2>/dev/null || echo "(缺文件)"
          echo ""
          echo "==== expire_at.txt ===="
          cat expire_at.txt 2>/dev/null || echo "(无)"
          echo ""
          if [ -f expire_at.txt ]; then
            EXP=$(cat expire_at.txt)
            NOW=$(date +%s)
            echo "now       = $NOW"
            echo "expire_at = $EXP"
            echo "diff      = $((NOW - EXP))"
            if [ "$EXP" != "0" ]; then
              echo "到期时间   = $(date -u -d @$EXP '+%F %H:%M:%S UTC')"
            fi
          fi
          echo ""
          echo "==== sub.txt 大小 ===="
          wc -c sub.txt 2>/dev/null || echo "(无)"

      - name: Commit
        run: |
          git config user.name  "flm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sub.txt expire_at.txt
          if git diff --staged --quiet; then
            echo "无变化，不提交"
          else
            git commit -q -m "auto: $(date -u '+%F %H:%M UTC')"
            git push -q
            echo "已推送"
          fi
