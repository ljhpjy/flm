name: FLM Auto Renew

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - force
          - refresh
          - info

permissions:
  contents: write

concurrency:
  group: flm-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch core from private gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_RAW_URL: ${{ secrets.GIST_RAW_URL }}
        run: |
          set -e
          curl -sfL -H "Authorization: token $GIST_TOKEN" "$GIST_RAW_URL" -o flm_core.py
          echo "脚本行数: $(wc -l < flm_core.py)"

      - name: Run
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          FLM_WINDOW: '60'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="auto"; fi
          echo "==== 模式: $MODE ===="
          python3 flm_core.py --"$MODE"
          echo "==== exit: $? ===="

      - name: Show state
        if: always()
        run: |
          echo "==== 工作目录 ===="
          pwd
          echo ""
          echo "==== 文件列表 ===="
          ls -la | grep -E 'sub\.txt|expire_at\.txt|sub_url\.txt' || echo "(无相关文件)"
          echo ""
          echo "==== expire_at.txt ===="
          if [ -f expire_at.txt ]; then
            EXP=$(cat expire_at.txt)
            NOW=$(date +%s)
            echo "内容 = ${EXP:-（空）}"
            echo "now  = $NOW"
            [ -n "$EXP" ] && [ "$EXP" != "0" ] && echo "到期 = $(date -u -d @$EXP '+%F %H:%M:%S UTC')"
          else
            echo "(文件不存在)"
          fi
          echo ""
          echo "==== sub.txt ===="
          if [ -f sub.txt ]; then
            echo "大小 = $(wc -c < sub.txt) 字节"
          else
            echo "(文件不存在)"
          fi

      - name: Commit
        if: always()
        run: |
          set +e
          git config user.name  "flm-bot"
          git config user.email "bot@users.noreply.github.com"

          ADDED=0
          for f in sub.txt expire_at.txt; do
            if [ -f "$f" ]; then git add "$f"; ADDED=$((ADDED+1)); echo "add: $f"; else echo "skip: $f (不存在)"; fi
          done

          if [ "$ADDED" -eq 0 ]; then
            echo "⚠ 无输出文件，跳过提交"
            exit 0
          fi

          if git diff --staged --quiet; then
            echo "内容无变化"
          else
            git commit -q -m "auto: $(date -u '+%F %H:%M UTC')"
            git push -q && echo "✓ 已推送"
          fi
          exit 0
